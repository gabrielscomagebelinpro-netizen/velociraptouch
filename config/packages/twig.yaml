            declaration: 'déclarée à la préfecture de l’Hérault le 17 mars 2024 (Journal officiel du 9 avril 2024)'
            address: '64 allée Victor Schoelcher, 34070 Montpellier'
            rna: 'W343032161'
            siret: '932 697 329 00013'
